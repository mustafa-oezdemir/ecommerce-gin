global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]

  - job_name: ecommerce-app
    static_configs:
      - targets: ["app:9091"]

  - job_name: shipping-service
    static_configs:
      - targets: ["shipping-app:9092"]
