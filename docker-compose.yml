services:
  mysql:
    image: mysql:8.0
    container_name: ecommerce-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD"
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: cmd/server/Dockerfile

    container_name: ecommerce-app
    restart: unless-stopped

    environment:
      APP_ENV: ${APP_ENV}
      APP_PORT: ${APP_PORT}
      METRICS_PORT: ${METRICS_PORT}
      GIN_MODE: ${GIN_MODE}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_CONSOLE_FORMAT: ${LOG_CONSOLE_FORMAT:-text}
      LOG_FILE: /app/logs/ecommerce.log
      LOG_MAX_SIZE_MB: ${LOG_MAX_SIZE_MB:-100}
      LOG_MAX_BACKUPS: ${LOG_MAX_BACKUPS:-5}
      LOG_MAX_AGE_DAYS: ${LOG_MAX_AGE_DAYS:-28}
      LOG_COMPRESS: ${LOG_COMPRESS:-true}
      LOG_ADD_SOURCE: ${LOG_ADD_SOURCE:-false}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      DB_MAX_OPEN_CONNS: ${DB_MAX_OPEN_CONNS:-25}
      DB_MAX_IDLE_CONNS: ${DB_MAX_IDLE_CONNS:-10}
      DB_CONN_MAX_LIFETIME: ${DB_CONN_MAX_LIFETIME:-5m}
      DB_CONN_MAX_IDLE_TIME: ${DB_CONN_MAX_IDLE_TIME:-1m}
      DB_CONNECT_TIMEOUT: ${DB_CONNECT_TIMEOUT:-5s}
      DB_READ_TIMEOUT: ${DB_READ_TIMEOUT:-10s}
      DB_WRITE_TIMEOUT: ${DB_WRITE_TIMEOUT:-10s}
      DB_PING_TIMEOUT: ${DB_PING_TIMEOUT:-5s}
      SESSION_SECRET: ${SESSION_SECRET}
      SESSION_SECURE: ${SESSION_SECURE}
      CSRF_SECRET: ${CSRF_SECRET}
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      SMTP_FROM: no-reply@ecommerce.local

    ports:
      - "8080:8080"

    expose:
      - "9091"

    volumes:
      - app_logs:/app/logs

    depends_on:
      mysql:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  mailhog:
    image: mailhog/mailhog
    container_name: ecommerce-mailhog
    restart: unless-stopped
    ports:
      - "8025:8025"
    expose:
      - "1025"

  prometheus:
    image: prom/prometheus
    container_name: ecommerce-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - app

  grafana:
    image: grafana/grafana
    container_name: ecommerce-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  mysql_data:
  grafana_data:
  app_logs:
